<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Prakhar Singh · Forward Deployed Engineer & AI Product Manager</title>
<meta name="description" content="Prakhar Singh is a Forward Deployed Engineer and AI Product Manager in Noida who builds and ships products end to end with AI." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236A4578'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial Narrow,Arial,sans-serif' font-size='26' font-weight='800' fill='%23F4F2FF'%3EPS%3C/text%3E%3C/svg%3E">

<!-- Fonts: Big Shoulders Display (Google) + Melodrama (Fontshare, free) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=melodrama@300,400,500&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   BASE
   Colors are set from CONFIG in the script (see applyTheme()).
   ===================================================================== */
:root{
  --text:#F4F2FF; --accent:#BABAFB; --ok:#7CE38B;
  --ink:#14111F; --blue:#4C8DFF;
  --cond:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --serif:"Melodrama",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
html{scroll-behavior:auto}
body{color:var(--text);font-family:var(--cond);overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
::selection{background:var(--accent);color:var(--ink)}
.cond{font-family:var(--cond);text-transform:uppercase}
.mixed{text-transform:none}
.serif{font-family:var(--serif);font-weight:300}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Lenis */
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}

/* =====================================================================
   GLOBAL LAYERS (back to front)
   ===================================================================== */
#bg{position:fixed;inset:0;z-index:0;background:#6A4578}
html.static #bg{transition:background-color .8s ease}
#tint{position:fixed;inset:0;z-index:1;pointer-events:none}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
main{position:relative;z-index:3}
/* film grain over everything, flickers by jumping its tile around */
#grain{position:fixed;left:-50%;top:-50%;width:200%;height:200%;z-index:85;pointer-events:none;opacity:.15;background-size:180px 180px;animation:grain .7s steps(5) infinite;will-change:transform}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-6%,-2%)}80%{transform:translate(4%,4%)}100%{transform:translate(-2%,-3%)}}
/* the inset device "screen": 10px black + 20px radius */
.frame{position:fixed;inset:10px;border-radius:20px;box-shadow:0 0 0 60px #000;pointer-events:none;z-index:90}

/* =====================================================================
   FIXED UI
   ===================================================================== */
.ui{position:fixed;top:26px;left:30px;right:30px;z-index:60;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.ui>*{pointer-events:auto}
.ui-left{display:flex;align-items:center;gap:14px}
.ui-name{font-weight:800;font-size:21px;letter-spacing:.05em;display:inline-flex}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:99px;border:1.5px solid rgba(244,242,255,.35);background:rgba(20,17,31,.18);font-size:12.5px;font-weight:700;letter-spacing:.07em;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,227,139,.6)}100%{box-shadow:0 0 0 9px rgba(124,227,139,0)}}
.ui-right{display:flex;align-items:center;gap:28px}
.sound-wrap{position:relative}
.sound{appearance:none;background:none;border:0;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;letter-spacing:.08em;cursor:pointer;padding:6px 0}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px;width:17px}
.eq i{width:3px;height:3px;background:currentColor;border-radius:1px;transition:height .3s}
.sound.on .eq i{animation:eq .8s ease-in-out infinite}
.sound.on .eq i:nth-child(2){animation-delay:-.25s}
.sound.on .eq i:nth-child(3){animation-delay:-.5s}
.sound.on .eq i:nth-child(4){animation-delay:-.65s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.bubble{position:absolute;top:calc(100% + 14px);left:-8px;background:#fff;color:#111;border:2px solid #111;box-shadow:4px 4px 0 #111;padding:8px 12px 7px;font-size:15px;font-weight:800;letter-spacing:.05em;border-radius:10px;white-space:nowrap;transform-origin:22px 0;opacity:0;transform:scale(.5) translateY(-6px);transition:opacity .3s ease,transform .5s cubic-bezier(.3,1.7,.5,1);pointer-events:none}
.bubble::before{content:"";position:absolute;top:-8px;left:18px;width:12px;height:12px;background:#fff;border-left:2px solid #111;border-top:2px solid #111;transform:rotate(45deg)}
.bubble.show{opacity:1;transform:none}
.bubble.show span{display:inline-block;animation:bob 2.2s ease-in-out .6s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.nav{display:flex;gap:24px}
.nav a{font-size:15px;font-weight:800;letter-spacing:.08em;display:inline-flex}
.l{display:inline-block;will-change:transform}

/* ruler progress bar */
.ruler{position:fixed;left:26px;right:26px;bottom:18px;height:48px;z-index:60}
.ruler-labels{position:absolute;left:0;right:0;top:0;height:18px}
.ruler-label{position:absolute;top:0;transform:translateX(-50%);background:none;border:0;padding:0 2px;font-family:var(--cond);font-size:12px;font-weight:800;letter-spacing:.14em;opacity:.5;cursor:pointer;white-space:nowrap;transition:opacity .3s,color .3s}
.ruler-label.first{transform:none}
.ruler-label.last{transform:translateX(-100%)}
.ruler-label:hover{opacity:.9}
.ruler-label.active{opacity:1;color:var(--accent)}
.ruler-ticks{position:absolute;left:0;right:0;bottom:0;height:20px}
.ruler-ticks::before,.ruler-ticks::after{content:"";position:absolute;left:0;right:0;bottom:0}
.ruler-ticks::before{height:8px;background:repeating-linear-gradient(90deg,rgba(244,242,255,.32) 0 1px,transparent 1px 8px)}
.ruler-ticks::after{height:16px;background:repeating-linear-gradient(90deg,rgba(244,242,255,.55) 0 1px,transparent 1px 80px)}
.ruler-head{position:absolute;left:0;bottom:0;width:2px;height:26px;margin-left:-1px;background:#fff;border-radius:2px;box-shadow:0 0 10px var(--accent),0 0 2px #fff;will-change:transform}

/* custom cursor */
.has-cursor,.has-cursor *{cursor:none!important}
.cursor{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:0;transition:opacity .3s}
.cursor-on .cursor{opacity:1}
.c-dot,.c-ring{position:fixed;left:0;top:0;will-change:transform}
.c-dot{width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--accent)}
.c-ring{width:40px;height:40px;margin:-20px 0 0 -20px}
.c-ring i{display:block;width:100%;height:100%;border-radius:50%;border:1.5px solid var(--text);transition:transform .35s cubic-bezier(.2,.9,.3,1.25),background .3s,border-color .3s}
.cursor-big .c-ring i{transform:scale(1.9);background:rgba(186,186,251,.16);border-color:var(--accent)}

/* hard offset shadow + press-down, for buttons and stickers */
.hard{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease}
.hard:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.hard:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px 11px;border-radius:14px;background:var(--accent);color:var(--ink);font-family:var(--cond);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}

/* =====================================================================
   SHARED PIECES
   ===================================================================== */
.sec{position:relative;width:100%;min-height:100vh;overflow:hidden}
.word{display:inline-flex;white-space:nowrap}
.ch{display:inline-block;will-change:transform}
.chi{display:inline-block}
.spark{position:absolute;fill:var(--text);opacity:.55;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.25}50%{transform:scale(1) rotate(25deg);opacity:.8}}

/* googly-eyed critters */
.critter{--s:84px;position:absolute;left:0;top:calc(var(--s) * -1);width:var(--s);height:var(--s);will-change:transform}
.critter-body{position:relative;width:100%;height:100%;border-radius:50%;background:var(--c);border:3px solid var(--ink);box-shadow:inset -7px -8px 0 rgba(0,0,0,.14);animation:squish 1.5s ease-in-out infinite}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.94)}}
.eye{position:absolute;top:24%;width:36%;height:36%;border-radius:50%;background:#fff;border:2.5px solid var(--ink)}
.eye:nth-child(1){left:12%}.eye:nth-child(2){right:12%}
.pupil{position:absolute;left:27%;top:27%;width:46%;height:46%;border-radius:50%;background:var(--ink);will-change:transform}
.mouth{position:absolute;left:39%;bottom:17%;width:22%;height:12%;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 30px 30px}

/* =====================================================================
   1. HELLO
   ===================================================================== */
.hello{height:100vh}
.hello-track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;padding:0 7vw;z-index:2;will-change:transform}
.hello-title{margin:0;display:flex;gap:.2em;white-space:nowrap;font-size:clamp(140px,60vh,760px);line-height:.78;font-weight:900;letter-spacing:-.005em}
.wave-wrap{position:absolute;left:0;right:0;top:50%;height:200px;margin-top:-80px;z-index:1;overflow:hidden;pointer-events:none}
.wave{width:3600px;height:200px;animation:wave 5s linear infinite}
.wave path{fill:none;stroke:rgba(186,186,251,.5);stroke-width:3}
@keyframes wave{to{transform:translateX(-400px)}}
.hello-foot{position:absolute;left:7vw;right:7vw;bottom:96px;display:flex;justify-content:space-between;gap:20px;font-size:16px;font-weight:800;letter-spacing:.12em;z-index:3}
.hello-foot .hint{color:var(--accent)}

/* =====================================================================
   2. BUILD
   ===================================================================== */
.build{height:100vh}
.build-stage{position:absolute;inset:0}
.build-head{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.build-label{font-size:clamp(24px,3.2vw,46px);font-weight:800;letter-spacing:.12em;margin-bottom:2vh}
.build-word-wrap{position:relative;transform:rotate(-7deg)}
.build-word{font-size:clamp(110px,21vw,400px);line-height:.8;font-weight:900}
.critters{position:absolute;left:0;right:0;top:0;height:0}
.ship{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:0 6vw;pointer-events:none}
.ship-card{pointer-events:auto;width:min(560px,88vw);background:#fff;color:#111;border:3px solid var(--ink);border-radius:26px;box-shadow:10px 10px 0 var(--ink);padding:20px 24px 24px}
.win{display:flex;gap:7px;margin-bottom:22px}
.win i{width:12px;height:12px;border-radius:50%;border:2px solid #111;background:#E9E7F3}
.win i:first-child{background:#F3A6A6}.win i:nth-child(2){background:#F3DE8A}
.bar{height:20px;border-radius:10px;background:#E8E6F2}
.bar.t{width:64%}
.bar.s{width:42%;height:13px;margin-top:12px;background:#F0EEF7}
.bar.m{height:10px;margin:7px 0;background:#F0EEF7}
.avatars{display:flex;gap:10px;margin:24px 0}
.avatars .critter{--s:48px;position:relative;left:auto;top:auto}
.ship-foot{display:flex;justify-content:space-between;align-items:center;gap:20px}
.ship-foot .bars{flex:1}
.ship-btn{background:#111;color:#fff;border-radius:14px;padding:12px 24px 11px;font-family:var(--cond);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 var(--accent)}
.ship-btn:active{box-shadow:0 0 0 var(--accent)}
.ship-caption{margin:0;text-align:center;font-size:clamp(20px,2.3vw,32px);line-height:1.25;max-width:780px}
.cap-line{display:block}

/* =====================================================================
   3. YEARS
   ===================================================================== */
.years{display:flex;align-items:center;justify-content:center;text-align:center;padding:6vh 6vw;min-height:75vh}
.years-big{font-size:clamp(90px,17vw,330px);line-height:.95;margin:0;font-weight:300;letter-spacing:-.02em;white-space:nowrap}
.yl{display:inline-block;padding:0 .02em}
.squiggle{display:block;width:min(660px,72vw);height:auto;margin:6px auto 30px;overflow:visible}
.squiggle path{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
.years-tag{font-size:clamp(30px,5.2vw,90px);font-weight:900;margin:0;line-height:.95;letter-spacing:.01em}
.tw{display:inline-block}

/* =====================================================================
   4. BELIEFS
   ===================================================================== */
.beliefs{height:100vh}
.beliefs-stage{position:absolute;inset:0;display:grid;align-items:center}
.belief{grid-area:1/1;position:relative;padding:0 9vw}
.belief.center{text-align:center}
.belief-text{font-size:clamp(42px,6.3vw,110px);line-height:1.03;font-weight:300;margin:0;max-width:15ch}
.belief.center .belief-text{max-width:17ch;margin:0 auto}
.bw{display:inline-block}
.belief-sub{font-size:clamp(18px,1.7vw,25px);font-weight:700;letter-spacing:.03em;color:var(--accent);max-width:560px;margin:30px 0 0;line-height:1.3;text-transform:uppercase}
.belief-cta{font-size:clamp(19px,1.9vw,28px);font-weight:800;letter-spacing:.05em;margin:34px auto 0;color:var(--accent);text-transform:uppercase;max-width:640px}
.doodle{position:absolute;width:clamp(90px,11vw,170px);height:auto;overflow:visible}
.doodle *{vector-effect:non-scaling-stroke}
.d1{left:7vw;top:-26vh}.d2{right:8vw;top:-22vh}.d3{right:13vw;bottom:-24vh}
.flag{transform-box:fill-box;transform-origin:left center;animation:flag 1.1s ease-in-out infinite alternate}
@keyframes flag{to{transform:skewY(-9deg) scaleX(.88)}}

/* =====================================================================
   5. NOIDA
   ===================================================================== */
.noida{min-height:80vh;padding:9vh 0 8vh;display:flex;flex-direction:column;justify-content:center}
.noida-title{font-size:clamp(70px,13vw,250px);font-weight:900;line-height:.82;margin:0 6vw;display:flex;flex-wrap:wrap;gap:0 .22em}
.scene{display:block;width:100%;height:auto;margin-top:2vh;color:var(--text);overflow:visible}
.steam{stroke-dasharray:12 10;animation:steam 1.6s linear infinite;opacity:.7}
.steam.s2{animation-duration:2.1s}
@keyframes steam{to{stroke-dashoffset:-44}}
.rick-bob{transform-box:fill-box;animation:rickbob .3s ease-in-out infinite alternate}
@keyframes rickbob{to{transform:translateY(-2px)}}
.noida-text{font-size:clamp(20px,2vw,30px);line-height:1.32;max-width:660px;margin:2vh 6vw 0}

/* =====================================================================
   6. WORK
   ===================================================================== */
.work{height:100vh}
.work-row{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:3vw;padding:40px 9vw 40px 7vw;will-change:transform}
.work-intro{flex:0 0 auto;width:min(470px,36vw);margin-right:3vw}
.peek{position:relative;width:100px;height:56px;overflow:hidden;margin:0 0 -4px 12px}
.peek .critter{--s:86px;left:6px;top:auto;bottom:-46px;animation:peek 4.5s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translateY(34px)}20%,70%{transform:translateY(0)}78%{transform:translateY(6px)}}
.work-title{font-size:clamp(70px,7.6vw,150px);line-height:.8;font-weight:900;margin:0}
.work-lede{font-size:21px;line-height:1.35;margin:24px 0 28px;max-width:370px}
.card{flex:0 0 auto;width:clamp(320px,31vw,500px);background:var(--card);border-radius:24px;padding:16px 16px 24px;border:2px solid var(--ink);box-shadow:8px 8px 0 rgba(20,17,31,.7);will-change:transform}
.card-label{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:800;letter-spacing:.09em;padding:2px 4px 12px;text-transform:uppercase}
.card-label span:last-child{opacity:.75;text-align:right}
.shot{position:relative;border:5px solid var(--ink);border-radius:18px;aspect-ratio:16/10;overflow:hidden;background:#1d1a2a}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot.mark{container-type:inline-size;display:grid;place-items:center;background:
  radial-gradient(circle at 1px 1px,rgba(244,242,255,.16) 1.2px,transparent 1.6px) 0 0/18px 18px,
  radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.14),transparent 60%),var(--mbg)}
.mark-wave{position:absolute;left:0;top:50%;width:200%;height:40%;margin-top:-6%;animation:wave 6s linear infinite;pointer-events:none}
.mark-wave path{fill:none;stroke:rgba(186,186,251,.55);stroke-width:2.5;vector-effect:non-scaling-stroke}
.mark-word{position:relative;z-index:1;font-size:var(--fs);line-height:.8;font-weight:900;color:var(--text);display:flex;text-shadow:.04em .05em 0 rgba(20,17,31,.55)}
.mark-word .ch{transform-origin:50% 80%}
.mark .spark{opacity:.7}
.mark-num{position:absolute;left:12px;top:10px;font-size:12px;font-weight:800;letter-spacing:.14em;opacity:.7;z-index:1}
.soon{position:absolute;right:12px;top:12px;z-index:2;background:#FFF4D6;color:#111;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:9px;padding:5px 9px 4px;font-size:13px;font-weight:900;letter-spacing:.08em;transform:rotate(6deg);animation:soonbob 2.4s ease-in-out infinite}
@keyframes soonbob{0%,100%{transform:rotate(6deg) translateY(0)}50%{transform:rotate(3deg) translateY(-3px)}}
.soon-note{display:inline-flex;align-items:center;gap:8px;border-bottom:0!important;color:var(--accent)}
.mark-tag{position:absolute;right:10px;bottom:10px;z-index:1;font-size:11px;font-weight:800;letter-spacing:.1em;padding:4px 8px 3px;border-radius:7px;background:rgba(20,17,31,.55)}
.card h3{font-family:var(--serif);font-size:clamp(25px,2.2vw,35px);line-height:1.08;font-weight:400;margin:20px 4px 10px}
.card p{font-size:19px;line-height:1.3;margin:0 4px;opacity:.88;font-weight:500}
.card .more{display:inline-block;margin:16px 4px 0;font-weight:800;letter-spacing:.09em;font-size:15px;border-bottom:2px solid currentColor;text-transform:uppercase}

/* =====================================================================
   7. DETAILS
   ===================================================================== */
.details{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 9vw}
.plane-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.plane-trail{fill:none;stroke:rgba(244,242,255,.5);stroke-width:2.5;stroke-linecap:round}
.details-text{position:relative;z-index:2;font-size:clamp(48px,7.2vw,130px);line-height:1;font-weight:300;margin:0}
.dl{display:block;overflow:hidden;padding-bottom:.08em}
.dl-in{display:inline-block;white-space:nowrap}
.details-sub{position:relative;z-index:2;margin:5vh 0 0;font-size:clamp(15px,1.4vw,20px);font-weight:800;letter-spacing:.14em;color:var(--accent);max-width:720px;line-height:1.5}

/* =====================================================================
   8. RIPPLE
   ===================================================================== */
.ripple{height:100vh;display:grid;place-items:center}
.rings{position:absolute;inset:0;display:grid;place-items:center}
.ring{grid-area:1/1;width:22vmax;height:22vmax;border-radius:50%;border:2px solid var(--accent);will-change:transform}
.ripple-label{position:relative;font-size:clamp(18px,2vw,28px);font-weight:800;letter-spacing:.2em}

/* =====================================================================
   9. CONTACT
   ===================================================================== */
.contact{height:100vh;min-height:660px}
.contact-top{position:relative;z-index:3;text-align:center;padding-top:96px}
.contact-kicker{font-size:clamp(14px,1.3vw,18px);font-weight:800;letter-spacing:.24em}
.sel-wrap{position:relative;display:inline-block;margin:22px auto 10px}
.contact-name{font-size:clamp(60px,10vw,184px);line-height:.95;margin:0;font-weight:300;padding:0 .1em;white-space:nowrap}
.sel{position:absolute;inset:-8px -14px;border:2px solid var(--blue);pointer-events:none}
.sel .h{position:absolute;width:11px;height:11px;background:#fff;border:2px solid var(--blue)}
.sel .tl{left:-7px;top:-7px}.sel .tr{right:-7px;top:-7px}.sel .bl{left:-7px;bottom:-7px}.sel .br{right:-7px;bottom:-7px}
.sel-size{position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);background:var(--blue);color:#fff;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;padding:4px 7px;border-radius:5px;white-space:nowrap}
.contact-sub{font-size:clamp(16px,1.6vw,23px);font-weight:800;letter-spacing:.22em;margin-top:40px;color:var(--accent)}
.me-pos{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:1}

  /* =====================================================================
     SOUND: a soft synth pad + tiny UI blips, made with Web Audio
     (no audio files needed). Starts only after the visitor clicks.
     ===================================================================== */
  const Sound = {
    ctx: null, master: null, on: false, voices: [], timer: null, idx: 0,
    chords: [[130.81, 196.00, 246.94, 329.63], [110.00, 164.81, 261.63, 329.63],
             [87.31, 174.61, 220.00, 261.63], [98.00, 146.83, 246.94, 293.66]],
    init() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = this.ctx = new AC();
      this.master = ctx.createGain(); this.master.gain.value = 0; this.master.connect(ctx.destination);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1000; lp.Q.value = .6;
      const pad = ctx.createGain(); pad.gain.value = .11;
      const delay = ctx.createDelay(1.5); delay.delayTime.value = .42;
      const fb = ctx.createGain(); fb.gain.value = .36;
      const wet = ctx.createGain(); wet.gain.value = .32;
      lp.connect(pad); pad.connect(this.master);
      pad.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(this.master);
      this.chords[0].forEach((f, i) => {
        const o = ctx.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine';
        o.frequency.value = f; o.detune.value = (i - 1.5) * 6;
        const g = ctx.createGain(); g.gain.value = i ? .2 : .3;
        o.connect(g); g.connect(lp); o.start(); this.voices.push(o);
      });
      const lfo = ctx.createOscillator(); lfo.frequency.value = .07;
      const lg = ctx.createGain(); lg.gain.value = 450; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
      const lfo2 = ctx.createOscillator(); lfo2.frequency.value = .19;
      const lg2 = ctx.createGain(); lg2.gain.value = .035; lfo2.connect(lg2); lg2.connect(pad.gain); lfo2.start();
      return true;
    },
    nextChord() {
      this.idx = (this.idx + 1) % this.chords.length;
      const t = this.ctx.currentTime;
      this.chords[this.idx].forEach((f, i) => this.voices[i].frequency.setTargetAtTime(f, t, 1.2));
    },
    toggle() {
      if (!this.ctx && !this.init()) return false;
      this.on = !this.on;
      this.ctx.resume();
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setTargetAtTime(this.on ? .55 : 0, t, this.on ? .8 : .2);
      clearInterval(this.timer);
      if (this.on) this.timer = setInterval(() => this.nextChord(), 9000);
      return this.on;
    },
    blip(freq) {
      if (!this.on) return;
      const ctx = this.ctx, t = ctx.currentTime, f = freq || 900 + Math.random() * 450;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 1.5, t + .06);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.1, t + .008);
      g.gain.exponentialRampToValueAtTime(.0001, t + .12);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .14);
    }
  };

  function setupSound() {
    const btn = $('#soundBtn'), label = $('#soundLabel'), bubble = $('#bubble');
    const hideBubble = () => bubble.classList.remove('show');
    setTimeout(() => bubble.classList.add('show'), 1400);
    setTimeout(hideBubble, 11000);
    btn.addEventListener('click', () => {
      const on = Sound.toggle();
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-pressed', on);
      label.textContent = on ? 'SOUND ON' : 'SOUND OFF';
      hideBubble();
      Sound.blip(1200);
    });
    // tiny click on hover of anything interactive
    let last = null;
    document.addEventListener('pointerover', e => {
      const el = e.target.closest('a,button');
      if (el && el !== last) Sound.blip();
      last = el;
    });
  }

  /* =====================================================================
     STARS: one full-screen canvas, twinkling and drifting, with a little
     mouse and scroll parallax. Runs on the GSAP ticker (one rAF loop).
     ===================================================================== */
  function setupStars() {
    const cv = $('#stars'), ctx = cv.getContext('2d');
    let W = 0, H = 0, stars = [];
    const m = { x: 0, y: 0, tx: 0, ty: 0 };
    const color = C.colors.text;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(Math.min(280, W * H / 6500));
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() ** 2 * 1.8 + .35, z: Math.random() * .9 + .1,
        tw: Math.random() * 2 + .6, ph: Math.random() * 6.28,
        vx: (Math.random() - .5) * .08, vy: -(Math.random() * .06 + .01)
      }));
      draw(0);
    }

    function draw(t) {
      const still = reduceQ.matches;
      ctx.clearRect(0, 0, W, H);
      m.x += (m.tx - m.x) * .05; m.y += (m.ty - m.y) * .05;
      const sy = window.scrollY;
      ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = .7;
      for (const s of stars) {
        if (!still) {
          s.x += s.vx; s.y += s.vy;
          if (s.x < -10) s.x = W + 10; else if (s.x > W + 10) s.x = -10;
          if (s.y < -10) s.y = H + 10;
        }
        const a = still ? .7 : .22 + .78 * (.5 + .5 * Math.sin(t * s.tw + s.ph));
        const px = s.x - m.x * 40 * s.z;
        const py = ((s.y - m.y * 40 * s.z - sy * .04 * s.z) % H + H) % H;
        ctx.globalAlpha = a;
        if (s.r < 1) ctx.fillRect(px, py, s.r * 1.6, s.r * 1.6);
        else {
          ctx.beginPath(); ctx.arc(px, py, s.r, 0, 6.283); ctx.fill();
          if (s.r > 1.6 && a > .8) {
            ctx.beginPath(); ctx.moveTo(px - 6, py); ctx.lineTo(px + 6, py); ctx.moveTo(px, py - 6); ctx.lineTo(px, py + 6); ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
    }

    addEventListener('resize', resize);
    addEventListener('pointermove', e => { m.tx = e.clientX / W - .5; m.ty = e.clientY / H - .5; }, { passive: true });
    resize();
    if (window.gsap) gsap.ticker.add(time => { if (!reduceQ.matches && !document.hidden) draw(time); });
  }

  /* ---------- film grain tile, generated once ---------- */
  function setupGrain() {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d'), d = x.createImageData(180, 180);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = Math.random() * 255 | 0;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255;
    }
    x.putImageData(d, 0, 0);
    $('#grain').style.backgroundImage = `url(${c.toDataURL()})`;
  }

  /* ---------- custom cursor ---------- */
  function setupCursor() {
    if (!finePointer || !window.gsap) return;
    root.classList.add('has-cursor');
    const dot = $('.c-dot'), ring = $('.c-ring');
    const dx = gsap.quickTo(dot, 'x', { duration: .08 }), dy = gsap.quickTo(dot, 'y', { duration: .08 });
    const rx = gsap.quickTo(ring, 'x', { duration: .45, ease: 'power3' }), ry = gsap.quickTo(ring, 'y', { duration: .45, ease: 'power3' });
    addEventListener('pointermove', e => {
      dx(e.clientX); dy(e.clientY); rx(e.clientX); ry(e.clientY);
      root.classList.add('cursor-on');
    }, { passive: true });
    document.addEventListener('pointerover', e => {
      root.classList.toggle('cursor-big', !!e.target.closest('a,button,[data-hover]'));
    });
    document.documentElement.addEventListener('mouseleave', () => root.classList.remove('cursor-on'));
  }

  /* ---------- googly eyes follow the cursor (or wander on touch) ---------- */
  function setupEyes() {
    const eyes = $$('.eye, .svg-eye').map(el => ({ el, pupil: $('.pupil', el), svg: el.classList.contains('svg-eye') }));
    let mx = innerWidth / 2, my = innerHeight / 2, raf = 0;
    function update() {
      raf = 0;
      for (const e of eyes) {
        const r = e.el.getBoundingClientRect();
        if (r.bottom < 0 || r.top > innerHeight || !r.width) continue;
        const dx = mx - (r.left + r.width / 2), dy = my - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 160);
        if (e.svg) {
          const m = +e.el.dataset.m * k;
          e.pupil.setAttribute('transform', `translate(${(dx / d * m).toFixed(2)} ${(dy / d * m).toFixed(2)})`);
        } else {
          const m = r.width * .25 * k;
          e.pupil.style.transform = `translate(${(dx / d * m).toFixed(2)}px,${(dy / d * m).toFixed(2)}px)`;
        }
      }
    }
    const queue = () => { if (!raf) raf = requestAnimationFrame(update); };
    addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; queue(); }, { passive: true });
    addEventListener('scroll', queue, { passive: true });
    if (!finePointer) setInterval(() => { mx = Math.random() * innerWidth; my = Math.random() * innerHeight; queue(); }, 1800);
    queue();
  }

  /* ---------- nav letters jump on hover ---------- */
  function setupJumpy() {
    $$('.jumpy').forEach(a => {
      const t = a.textContent.trim();
      a.setAttribute('aria-label', t);
      a.innerHTML = [...t].map(c => `<span class="l" aria-hidden="true">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('');
      if (!window.gsap) return;
      const ls = $$('.l', a);
      a.addEventListener('mouseenter', () => {
        if (reduceQ.matches) return;
        gsap.fromTo(ls, { y: 0, rotation: 0 }, {
          y: -7, rotation: () => gsap.utils.random(-16, 16), duration: .16, yoyo: true, repeat: 1,
          stagger: .035, ease: 'power2.out', overwrite: true
        });
      });
    });
  }

  /* ---------- work tiles: letters hop when a card is hovered ---------- */
  function setupTiles() {
    if (!window.gsap) return;
    $$('.card').forEach(card => {
      const ls = $$('.mark-word .ch', card);
      if (!ls.length) return;
      card.addEventListener('mouseenter', () => {
        if (reduceQ.matches) return;
        gsap.fromTo(ls, { y: 0, rotation: 0 }, { y: '-14%', rotation: () => gsap.utils.random(-12, 12), duration: .2,
          yoyo: true, repeat: 1, stagger: .05, ease: 'power2.out', overwrite: true });
      });
    });
  }

  /* ---------- contact bits: copy email, size tag, sticker spin ---------- */
  function setupContact() {
    const btn = $('#copyBtn');
    btn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(C.email); }
      catch {
        const ta = document.createElement('textarea'); ta.value = C.email;
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      btn.textContent = 'COPIED ✓'; Sound.blip(1500);
      setTimeout(() => (btn.textContent = 'COPY'), 1600);
    });
    const name = $('#contactName'), size = $('#selSize');
    const setSize = () => { const r = name.getBoundingClientRect(); size.textContent = `${Math.round(r.width)} × ${Math.round(r.height)}`; };
    if ('ResizeObserver' in window) new ResizeObserver(setSize).observe(name); else setSize();
    if (window.gsap) {
      gsap.set('.sticker-pos', { rotation: 9 });
      $('.sticker').addEventListener('click', () => {
        Sound.blip(700);
        if (!reduceQ.matches) gsap.to('.sticker-pos', { rotation: '+=360', duration: .9, ease: 'back.out(1.4)' });
      });
    }
  }

  /* =====================================================================
     SCROLL: smooth scrolling, ruler, background colors
     ===================================================================== */
  let colorMarks = [], labelMarks = [], baseColor = C.colors.hello;
  const bgEl = $('#bg');

  function startLenis() {
    if (typeof Lenis === 'undefined') return () => {};
    lenis = new Lenis({ lerp: .14, wheelMultiplier: 1.15, smoothWheel: true });
    lenis.on('scroll', ScrollTrigger.update);
    const tick = t => lenis.raf(t * 1000);
    gsap.ticker.add(tick);
    gsap.ticker.lagSmoothing(0);
    return () => { gsap.ticker.remove(tick); lenis.destroy(); lenis = null; };
  }

  function scrollToY(y) {
    if (lenis) lenis.scrollTo(y, { duration: 1.1, easing: t => 1 - Math.pow(1 - t, 4) });
    else window.scrollTo({ top: y, behavior: reduceQ.matches ? 'auto' : 'smooth' });
  }

  function sectionY(el) {
    const m = labelMarks.find(o => o.el === el);
    return m ? m.st.start + 2 : el.getBoundingClientRect().top + window.scrollY;
  }

  // Build the ruler labels once; positions are set in layoutRuler()
  const labelSecs = () => $$('[data-label]');
  function buildRuler() {
    const wrap = $('#rulerLabels');
    wrap.innerHTML = labelSecs().map((s, i, a) =>
      `<button class="ruler-label${i === 0 ? ' first' : ''}${i === a.length - 1 ? ' last' : ''}" type="button" data-i="${i}">${esc(s.dataset.label)}</button>`).join('');
    $$('.ruler-label').forEach((b, i) => b.addEventListener('click', () => scrollToY(sectionY(labelSecs()[i]))));
    // in-page links (nav, name)
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const t = document.getElementById(a.getAttribute('href').slice(1));
      if (!t) return;
      e.preventDefault();
      scrollToY(sectionY(t));
    });
  }

  // Marker triggers: created after all pins so their start positions include pin spacing
  function createMarks(reduce) {
    const secs = $$('[data-color]');
    baseColor = C.colors[secs[0].dataset.color];
    colorMarks = secs.slice(1).map((s, i) => ({
      from: C.colors[secs[i].dataset.color], to: C.colors[s.dataset.color],
      st: ScrollTrigger.create({ trigger: s, start: reduce ? 'top 55%' : 'top 85%', end: reduce ? 'top 54%' : 'top 15%' })
    })).filter(o => o.from !== o.to);
    const outer = el => (el.parentElement && el.parentElement.classList.contains('pin-spacer')) ? el.parentElement : el;
    labelMarks = labelSecs().map(el => ({ el, st: ScrollTrigger.create({ trigger: outer(el), start: 'top top' }) }));
  }

  function layoutRuler() {
    const max = ScrollTrigger.maxScroll(window) || 1;
    $$('.ruler-label').forEach((b, i) => {
      const m = labelMarks[i];
      if (m) b.style.left = Math.min(100, Math.max(0, m.st.start / max * 100)) + '%';
    });
  }

  // runs on every scroll: moves the ruler tick, highlights the label, blends the bg color
  function onScroll() {
    const y = window.scrollY, max = (window.ScrollTrigger ? ScrollTrigger.maxScroll(window) : root.scrollHeight - innerHeight) || 1;
    const p = Math.min(1, Math.max(0, y / max));
    $('#rulerHead').style.transform = `translateX(${p * $('#rulerTicks').offsetWidth}px)`;
    let a = 0;
    labelMarks.forEach((m, i) => { if (y >= m.st.start - innerHeight * .35) a = i; });
    $$('.ruler-label').forEach((b, i) => b.classList.toggle('active', i === a));
    let col = baseColor;
    for (const c of colorMarks) {
      if (y >= c.st.end) { col = c.to; continue; }
      if (y > c.st.start) col = gsap.utils.interpolate(c.from, c.to, (y - c.st.start) / (c.st.end - c.st.start));
      break;
    }
    bgEl.style.backgroundColor = col;
  }

  /* =====================================================================
     SECTION ANIMATIONS
     desk = wide screen with motion, otherwise mobile (lighter pins)
     ===================================================================== */

  // 1. HELLO: letters drop in, then the line slides sideways while pinned
  function animHello(desk) {
    const sec = $('#hello'), track = $('.hello-track'), chars = $$('#hello .ch');
    gsap.from(chars, { yPercent: 115, opacity: 0, duration: 1.1, ease: 'back.out(1.7)', stagger: .045, delay: .25 });
    gsap.from('.hello-foot > *', { opacity: 0, y: 20, duration: 1, delay: 1, stagger: .15 });
    if (desk) {
      const dist = () => Math.max(0, track.scrollWidth - innerWidth);
      const tl = gsap.timeline({
        scrollTrigger: { trigger: sec, start: 'top top', end: () => '+=' + (dist() * .85 + innerHeight * .2), pin: true, scrub: .35, invalidateOnRefresh: true }
      });
      tl.to(track, { x: () => -dist(), ease: 'none', duration: 1 }, 0)
        .to(chars, { y: i => Math.sin(i * 1.7) * 36, rotation: i => Math.cos(i * 2.3) * 7, ease: 'sine.inOut', duration: .5, stagger: { amount: .5 } }, 0)
        .to('.hello-foot', { opacity: 0, duration: .15 }, 0);
    } else {
      gsap.to(chars, { y: i => Math.sin(i * 1.7) * 22, rotation: i => Math.cos(i * 2.3) * 8, ease: 'none',
        scrollTrigger: { trigger: sec, start: 'top top', end: 'bottom top', scrub: .35 } });
    }
  }

  // 2. BUILD: critters roll and bounce over the word, then the product card appears
  function animBuild(desk) {
    const sec = $('#build'), word = $('.build-word'), label = $('.build-label');
    const crit = $$('#build .critters .critter');
    const startX = i => -140 - i * 90;
    const endX = i => word.offsetWidth * (.06 + i * .19);
    gsap.set(crit, { left: 0, x: startX });
    const tl = gsap.timeline({
      scrollTrigger: { trigger: sec, start: 'top top', end: desk ? '+=170%' : '+=120%', pin: true, scrub: .35, invalidateOnRefresh: true }
    });
    // the label and word pop in while the section scrolls into view
    gsap.timeline({ scrollTrigger: { trigger: sec, start: 'top 80%', end: 'top 10%', scrub: .35 } })
      .from(label, { y: 40, opacity: 0, duration: .3 }, 0)
      .from('#build .build-word .ch', { yPercent: 60, opacity: 0, rotation: i => (i % 2 ? 10 : -10), stagger: .04, duration: .4, ease: 'back.out(1.6)' }, 0);
    crit.forEach((el, i) => {
      const at = i * .05;
      tl.to(el, { x: () => endX(i), rotation: () => (endX(i) - startX(i)) / (Math.PI * el.offsetWidth) * 360, ease: 'none', duration: 1 }, at)
        .to(el, { keyframes: { y: [0, -(80 + i * 12), 0, -(52 + i * 8), 0, -(90 + i * 10), 0], easeEach: 'sine.inOut' }, ease: 'none', duration: 1 }, at);
    });
    tl.fromTo('.build-head', { opacity: 1, scale: 1 }, { opacity: .12, scale: .9, duration: .5 }, 1.45)
      .fromTo(crit, { scale: 1, opacity: 1 }, { y: -30, scale: .4, opacity: 0, duration: .4, stagger: .03, immediateRender: false }, 1.45)
      .fromTo('.ship-card', { scale: .35, opacity: 0, rotation: -6, y: 60 }, { scale: 1, opacity: 1, rotation: 0, y: 0, duration: .6, ease: 'back.out(1.4)' }, 1.55)
      .fromTo('.avatars .critter', { scale: 0 }, { scale: 1, stagger: .06, duration: .25, ease: 'back.out(2)' }, 1.9)
      .fromTo('.cap-line', { y: 24, opacity: 0 }, { y: 0, opacity: 1, stagger: .12, duration: .3 }, 2.05)
      .to({}, { duration: .15 });
  }

  // 3. YEARS: letters draw in, squiggle draws itself, tagline pops up
  function animYears() {
    const path = $('.squiggle path'), len = path.getTotalLength();
    gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
    const tl = gsap.timeline({ scrollTrigger: { trigger: '#years', start: 'top 75%', end: 'center 40%', scrub: .35 } });
    tl.fromTo('.yl', { clipPath: 'inset(0% 100% 0% 0%)', y: 30 }, { clipPath: 'inset(0% 0% 0% 0%)', y: 0, stagger: .12, duration: .5, ease: 'power1.out' })
      .to(path, { strokeDashoffset: 0, duration: .8, ease: 'none' }, '-=.25')
      .from('.tw', { yPercent: 100, opacity: 0, rotation: i => (i % 2 ? 6 : -6), stagger: .08, duration: .3 }, '-=.35');
  }

  // 4. BELIEFS: one statement at a time, words light up from 15% to 100%
  function animBeliefs(desk) {
    const items = $$('.belief');
    gsap.set(items, { autoAlpha: 0 }); gsap.set(items[0], { autoAlpha: 1 });
    const tl = gsap.timeline({
      scrollTrigger: { trigger: '#beliefs', start: 'top top', end: '+=' + items.length * (desk ? 75 : 60) + '%', pin: true, scrub: .35 }
    });
    items.forEach((it, i) => {
      const sub = $('.belief-sub', it), cta = $('.belief-cta', it), doo = $$('.doodle', it);
      if (i > 0) tl.fromTo(it, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: .3 });
      tl.fromTo($$('.bw', it), { opacity: .15 }, { opacity: 1, stagger: .08, duration: .2, ease: 'none' });
      if (sub) tl.from(sub, { opacity: 0, y: 20, duration: .3 });
      if (doo.length) tl.from(doo, { scale: 0, rotation: -25, opacity: 0, stagger: .15, duration: .35, ease: 'back.out(2.2)' });
      if (cta) tl.from(cta, { opacity: 0, y: 20, duration: .3 });
      tl.to({}, { duration: .25 });
      if (i < items.length - 1) tl.to(it, { autoAlpha: 0, y: -40, duration: .3 });
    });
  }

  // 5. NOIDA: title pops in, rickshaw drives right, metro runs left
  function animNoida() {
    gsap.from('#noida .ch', { yPercent: 80, opacity: 0, rotation: i => (i % 2 ? 8 : -8), stagger: .03, ease: 'back.out(1.6)',
      scrollTrigger: { trigger: '#noida', start: 'top 80%', end: 'top 25%', scrub: .35 } });
    const tl = gsap.timeline({ scrollTrigger: { trigger: '#noida', start: 'top bottom', end: 'bottom top', scrub: .3 } });
    tl.fromTo('#rick', { x: -280 }, { x: 1720, ease: 'none' }, 0)
      .fromTo('#rick .spin', { rotation: 0 }, { rotation: 6800, ease: 'none', transformOrigin: '50% 50%' }, 0)
      .fromTo('#metro', { x: 1650 }, { x: -640, ease: 'none' }, 0);
    gsap.from('.noida-text', { opacity: 0, y: 30, scrollTrigger: { trigger: '.noida-text', start: 'top 92%', end: 'top 65%', scrub: .35 } });
  }

  // 6. WORK: pinned horizontal scroll on desktop, stacked cards on mobile
  function animWork(desk) {
    const sec = $('#work'), row = $('.work-row'), cards = $$('.card');
    gsap.from('.work-intro > *', { y: 40, opacity: 0, stagger: .1, duration: .8, ease: 'power3.out', scrollTrigger: { trigger: sec, start: 'top 70%' } });
    if (desk) {
      const dist = () => Math.max(0, row.scrollWidth - innerWidth);
      const move = gsap.to(row, { x: () => -dist(), ease: 'none',
        scrollTrigger: { trigger: sec, start: 'top top', end: () => '+=' + dist(), pin: true, scrub: .35, invalidateOnRefresh: true } });
      cards.forEach(c => gsap.fromTo(c, { rotation: 4, y: 50 }, { rotation: -3, y: -20, ease: 'none',
        scrollTrigger: { trigger: c, containerAnimation: move, start: 'left right', end: 'right left', scrub: true } }));
      // background shifts a little for each card
      const tint = $('#tint');
      const tl = gsap.timeline({ scrollTrigger: { trigger: sec, start: 'top top', end: () => '+=' + dist(), scrub: true, invalidateOnRefresh: true } });
      tl.set(tint, { backgroundColor: 'rgba(0,0,0,0)' }, 0);
      C.projects.forEach(p => tl.to(tint, { backgroundColor: p.tint, duration: 1, ease: 'none' }));
      tl.to(tint, { backgroundColor: 'rgba(0,0,0,0)', duration: 1, ease: 'none' });
    } else {
      cards.forEach(c => gsap.from(c, { y: 60, opacity: 0, rotation: 3, duration: .8, ease: 'power3.out',
        scrollTrigger: { trigger: c, start: 'top 88%', toggleActions: 'play none none reverse' } }));
    }
  }

  // 7. DETAILS: lines rise one by one while a paper plane flies its loop
  function animDetails(desk) {
    const path = $('#planePath'), len = path.getTotalLength();
    gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
    const st = desk
      ? { trigger: '#details', start: 'top top', end: '+=100%', pin: true, scrub: .35 }
      : { trigger: '#details', start: 'top 80%', end: 'bottom 30%', scrub: .35 };
    const tl = gsap.timeline({ scrollTrigger: st });
    tl.from('.dl-in', { yPercent: 105, rotation: 3, stagger: .2, duration: .6, ease: 'power2.out' }, 0)
      .set('#plane', { opacity: 1 }, .01)
      .to('#plane', { motionPath: { path, align: path, alignOrigin: [.5, .5], autoRotate: true }, duration: 1.6, ease: 'none' }, 0)
      .to(path, { strokeDashoffset: 0, duration: 1.6, ease: 'none' }, 0)
      .from('.details-sub', { opacity: 0, y: 20, duration: .4 }, 1);
  }

  // 8. RIPPLE: rings expand out from the centre like a tunnel
  function animRipple(desk) {
    const rings = $$('.ring');
    const tl = gsap.timeline({ scrollTrigger: { trigger: '#ripple', start: 'top top', end: desk ? '+=85%' : '+=55%', pin: true, scrub: .35 } });
    tl.fromTo(rings, { scale: 0, opacity: 1 }, { scale: i => 1 + i * .85, opacity: i => 1 - i * .07, stagger: .08, duration: 1, ease: 'power2.out' }, 0)
      .fromTo('.ripple-label', { opacity: 0, scale: .8 }, { opacity: 1, scale: 1, duration: .4 }, .1)
      .to(rings, { scale: i => (1 + i * .85) * 2.4, opacity: 0, stagger: .04, duration: .8, ease: 'power2.in' }, 1.1)
      .to('.ripple-label', { opacity: 0, scale: 1.4, duration: .4 }, 1.2);
  }

  // 9. CONTACT: you rise up, the lid opens, ideas float out
  const THOUGHT_SPOTS = [[95, -112], [186, -182], [282, -142], [338, -48]];
  function animContact() {
    const th = $$('.th');
    gsap.set(th, { x: 200, y: 125, scale: 0, transformOrigin: '50% 50%' });
    const tl = gsap.timeline({ scrollTrigger: { trigger: '#contact', start: 'top bottom', end: 'bottom bottom', scrub: .35 } });
    tl.fromTo('.me-wrap', { yPercent: 75 }, { yPercent: 0, duration: 1, ease: 'power2.out' }, 0)
      .from('.contact-top > *', { y: 40, opacity: 0, stagger: .12, duration: .5 }, .1)
      .from('.sel', { opacity: 0, duration: .2 }, .45)
      .from('.sel .h', { scale: 0, stagger: .05, duration: .2, ease: 'back.out(3)' }, .5)
      .from('.contact-bottom > *', { y: 30, opacity: 0, stagger: .1, duration: .3 }, .7)
      .from('.sticker-pos', { scale: 0, duration: .3, ease: 'back.out(2)' }, .8)
      .to('.me-lid', { rotation: 22, y: -22, svgOrigin: '305 196', duration: .35, ease: 'back.out(1.6)' }, .95)
      .to('.me-inside', { opacity: 1, duration: .15 }, .98)
      .to(th, { x: i => THOUGHT_SPOTS[i][0], y: i => THOUGHT_SPOTS[i][1], scale: 1, stagger: .08, duration: .4, ease: 'back.out(1.6)' }, 1.05);
    gsap.to('.me-arm', { rotation: -16, svgOrigin: '300 380', duration: .55, yoyo: true, repeat: -1, ease: 'sine.inOut' });
  }

  // Reduced motion: no pins, no scrubbing. Blocks simply fade in.
  function animReduced() {
    $$('[data-fade]').forEach(el => {
      gsap.set(el, { opacity: 0 });
      ScrollTrigger.create({ trigger: el, start: 'top 90%', once: true, onEnter: () => gsap.to(el, { opacity: 1, duration: .8 }) });
    });
    gsap.set('.th', { x: i => THOUGHT_SPOTS[i][0], y: i => THOUGHT_SPOTS[i][1], scale: 1 });
    gsap.set('.me-lid', { rotation: 22, y: -22, svgOrigin: '305 196' });
    gsap.set('.me-inside', { opacity: 1 });
  }

  /* =====================================================================
     BOOT
     ===================================================================== */
  render();
  setupGrain();
  setupStars();
  setupSound();
  setupEyes();
  setupJumpy();
  setupCursor();
  setupContact();
  setupTiles();
  buildRuler();

  // If the animation libraries fail to load, show a plain readable page
  if (!window.gsap || !window.ScrollTrigger) {
    root.classList.add('stack', 'static');
    addEventListener('scroll', () => {
      const max = root.scrollHeight - innerHeight || 1;
      $('#rulerHead').style.transform = `translateX(${scrollY / max * $('#rulerTicks').offsetWidth}px)`;
    }, { passive: true });
    return;
  }

  gsap.registerPlugin(ScrollTrigger);
  if (window.MotionPathPlugin) gsap.registerPlugin(MotionPathPlugin);

  const mm = gsap.matchMedia();
  mm.add({
    desk: '(min-width: 900px) and (prefers-reduced-motion: no-preference)',
    mob: '(max-width: 899px) and (prefers-reduced-motion: no-preference)',
    reduce: '(prefers-reduced-motion: reduce)'
  }, ctx => {
    const { desk, reduce } = ctx.conditions;
    root.classList.toggle('stack', !desk);
    root.classList.toggle('static', !!reduce);
    const stopLenis = reduce ? () => {} : startLenis();

    if (reduce) animReduced();
    else {
      animHello(desk); animBuild(desk); animYears(); animBeliefs(desk); animNoida();
      animWork(desk);
      if (window.MotionPathPlugin) animDetails(desk);
      animRipple(desk); animContact();
    }
    createMarks(reduce);
    requestAnimationFrame(() => ScrollTrigger.refresh());
    return () => { stopLenis(); colorMarks = []; labelMarks = []; };
  });

  ScrollTrigger.addEventListener('refresh', () => { layoutRuler(); onScroll(); });
  addEventListener('scroll', onScroll, { passive: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => ScrollTrigger.refresh());
  addEventListener('load', () => ScrollTrigger.refresh());
})();
</script>
